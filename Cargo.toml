[package]
name = "agentsec"
version = "0.1.0"
edition = "2021"
description = "Unified AI Agent Security Scanner"
license = "MIT"
repository = "https://github.com/agentsec/agentsec"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
